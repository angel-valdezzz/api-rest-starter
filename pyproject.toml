[tool.poetry]
name = "api-rest-starter"
version = "0.2.0"
description = "Layered API business scenarios against the separate Demo Users API"
authors = ["Angel Gerardo Molina Valdez"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
requests = "2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-html = "4.1.1"
ruff = "0.14.2"
demo-users-api = {git = "https://github.com/angel-valdezzz/demo-users-api.git", rev = "971be3caf9cd88375c2dab8c935772c5fd2b95eb"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: real Demo Users API scenarios"]
log_cli = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_architecture.py" = ["E501"]
