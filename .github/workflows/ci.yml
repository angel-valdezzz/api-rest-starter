name: API architecture and business scenarios
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Verify the committed lockfile and sync the environment
        run: |
          poetry check --lock
          poetry sync
      - name: Quality and architectural boundaries
        run: |
          poetry run ruff format --check resources tests
          poetry run ruff check resources tests
          poetry run pytest -m "not integration" -v
      - name: Real API business scenarios
        run: poetry run pytest --local-api -m integration -v --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-api-review-evidence
          path: |
            reports/
            poetry.lock
          retention-days: 7
