name: API architecture and business scenarios
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Resolve the review lockfile and sync the environment
        run: |
          poetry lock
          poetry sync
      - name: Quality and architectural boundaries
        run: |
          poetry run ruff format resources tests
          poetry run ruff check --fix resources tests
          poetry run pytest -m "not integration" -v
      - name: Real API business scenarios
        run: poetry run pytest --local-api -m integration -v --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
      - name: Export locked dependencies and formatter changes for review
        if: always()
        run: |
          python - <<'PY'
          import base64, gzip, json, subprocess
          from pathlib import Path
          lock = Path('poetry.lock')
          if lock.exists():
              encoded = base64.b64encode(gzip.compress(lock.read_bytes())).decode()
              for offset in range(0, len(encoded), 4096):
                  print('POETRY_LOCK=' + encoded[offset:offset+4096])
          names = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          changes = {name: Path(name).read_text() for name in names if name.endswith('.py')}
          encoded = base64.b64encode(gzip.compress(json.dumps(changes).encode())).decode()
          for offset in range(0, len(encoded), 4096):
              print('FORMATTED_SOURCE=' + encoded[offset:offset+4096])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-api-review-evidence
          path: |
            reports/
            poetry.lock
          retention-days: 7
